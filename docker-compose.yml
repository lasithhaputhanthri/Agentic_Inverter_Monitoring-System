services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: iir-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto/password_file:/mosquitto/config/password_file:ro
      - ./config/mosquitto/acl_file:/mosquitto/config/acl_file:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: iir-app:latest
    container_name: iir-backend
    restart: unless-stopped
    command: ["uvicorn", "backend.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - APP_ENV=development
      - DATABASE_URL=sqlite:////app/data/iir.db
    volumes:
      - iir-data:/app/data
    depends_on:
      - mosquitto

  simulator:
    image: iir-app:latest
    container_name: iir-simulator
    restart: unless-stopped
    command: ["python", "-m", "simulator.runner", "--devices", "20", "--speed", "1.0"]
    env_file:
      - path: .env
        required: false
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
    depends_on:
      - mosquitto
      - backend

  frontend:
    image: iir-app:latest
    container_name: iir-frontend
    restart: unless-stopped
    command: ["streamlit", "run", "frontend/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - API_BASE_URL=http://backend:8000/v1
    depends_on:
      - backend

volumes:
  iir-data:
