[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iir"
version = "0.1.0"
description = "IoT Incident Response (simulated solar inverter fleet)"
authors = [{ name = "Lasith Haputhanthri" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.2",
    "pydantic-settings==2.6.1",
    "paho-mqtt==2.1.0",
    "fastapi==0.162.2",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "streamlit==1.67.0",
    "pillow==13.0.0",
    "langgraph==1.2.20",
    "pyyaml==6.0.3",
    "google-genai==2.34.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.9.9",
    "mypy==1.15.0",
    "bandit==1.8.3",
    "pip-audit==2.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["simulator*", "backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["simulator", "backend", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # FastAPI dependency injection in argument defaults
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["backend.common.*", "backend.monitor.*"]
disallow_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["paho.*", "pydantic.*", "pydantic_settings.*", "yaml.*", "fastapi.*", "sqlalchemy.*", "langgraph.*", "requests.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests requiring broker or external services",
    "security: Security tests",
    "eval: Evaluation and benchmark tests",
]

[tool.bandit]
exclude_dirs = ["tests", "data", ".venv", ".mypy_cache", ".pytest_cache"]
skips = ["B101"] # assert used in tests / validation
